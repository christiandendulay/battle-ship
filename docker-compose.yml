version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: battleship-api
    ports:
      - '3000:3000'
    environment:
      - API_PORT=3000
      - WEB_APP_URL=${WEB_APP_URL}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    # Mount local AWS credentials for development (GitHub Actions uses env vars above)
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - battleship-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: battleship-web
    ports:
      - '${VITE_WEB_PORT}:80'
    depends_on:
      - api
    networks:
      - battleship-network

networks:
  battleship-network:
    driver: bridge
