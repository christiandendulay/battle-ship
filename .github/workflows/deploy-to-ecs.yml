name: Build and Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/BattleShip-Github-Actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_ASSETS_URL: ${{ vars.VITE_ASSETS_URL }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_ASSETS_URL=$VITE_ASSETS_URL \
            -t $ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG \
            --push .
          echo "image=$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Update image in task definition
        run: |
          python3 << 'EOF'
          import json

          with open('task-definition.json', 'r') as f:
              task_def = json.load(f)

          # Update container image
          for container in task_def['containerDefinitions']:
              if container['name'] == '${{ vars.CONTAINER_NAME }}':
                  container['image'] = '${{ steps.build-image.outputs.image }}'

          # Remove AWS-managed fields that can't be re-registered
          for field in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes', 
                        'compatibilities', 'registeredAt', 'registeredBy']:
              task_def.pop(field, None)

          with open('new-task-def.json', 'w') as f:
              json.dump(task_def, f, indent=2)
          EOF

      - name: Register new task definition
        id: register-task
        run: |
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.revision }} \
            --force-new-deployment