name: Build and Deploy to ECS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/BattleShip-Github-Actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          for repo in "${{ vars.ECR_API_REPOSITORY }}" "${{ vars.ECR_WEB_REPOSITORY }}"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repo"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push API image to ECR
        id: build-api
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/api/Dockerfile \
            -t $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:$IMAGE_TAG \
            --push .
          echo "image=$ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push Web image to ECR
        id: build-web
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/web/Dockerfile \
            --build-arg VITE_API_URL=$VITE_API_URL \
            -t $ECR_REGISTRY/${{ vars.ECR_WEB_REPOSITORY }}:$IMAGE_TAG \
            --push .
          echo "image=$ECR_REGISTRY/${{ vars.ECR_WEB_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Update images in task definition
        run: |
          API_IMAGE="${{ steps.build-api.outputs.image }}"
          WEB_IMAGE="${{ steps.build-web.outputs.image }}"

          jq \
            --arg api_image "$API_IMAGE" \
            --arg web_image "$WEB_IMAGE" \
            --arg api_container "${{ vars.ECS_API_CONTAINER_NAME }}" \
            --arg web_container "${{ vars.ECS_WEB_CONTAINER_NAME }}" '
            .containerDefinitions |= map(
              if .name == $api_container then .image = $api_image
              elif .name == $web_container then .image = $web_image
              else .
              end
            ) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' task-definition.json > new-task-def.json

      - name: Register new task definition
        id: register-task
        run: |
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "revision=$REVISION" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task.outputs.revision }} \
            --force-new-deployment
